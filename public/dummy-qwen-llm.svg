<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0B132B"/>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#EE0979"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Subtle glowing orb -->
  <circle cx="400" cy="210" r="120" fill="url(#glow)" opacity="0.15" filter="blur(40px)"/>

  <!-- LLM Neural nodes illustration -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.5">
    <line x1="260" y1="210" x2="340" y2="160"/>
    <line x1="260" y1="210" x2="340" y2="260"/>
    <line x1="340" y1="160" x2="460" y2="160"/>
    <line x1="340" y1="260" x2="460" y2="260"/>
    <line x1="340" y1="160" x2="460" y2="260"/>
    <line x1="340" y1="260" x2="460" y2="160"/>
    <line x1="460" y1="160" x2="540" y2="210"/>
    <line x1="460" y1="260" x2="540" y2="210"/>
  </g>

  <!-- Nodes -->
  <circle cx="260" cy="210" r="9" fill="#F59E0B"/>
  <circle cx="340" cy="160" r="9" fill="#EC4899"/>
  <circle cx="340" cy="260" r="9" fill="#8B5CF6"/>
  <circle cx="460" cy="160" r="9" fill="#3B82F6"/>
  <circle cx="460" cy="260" r="9" fill="#10B981"/>
  <circle cx="540" cy="210" r="9" fill="#06B6D4"/>

  <!-- Center Badge / Text -->
  <rect x="230" y="330" width="340" height="42" rx="21" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="356" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    Alibaba Cloud Model Studio · Qwen LLM
  </text>
  <text x="400" y="410" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    [ Pratinjau Visual Segera Diperbarui ]
  </text>
</svg>