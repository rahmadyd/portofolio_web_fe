<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0F172A"/>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g1)"/>
  
  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Bounding Boxes illustration (Computer Vision / SAHI) -->
  <rect x="240" y="140" width="140" height="110" rx="6" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 4" fill="#38BDF8" fill-opacity="0.08"/>
  <rect x="240" y="118" width="85" height="22" rx="4" fill="#38BDF8"/>
  <text x="247" y="133" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RICE: 98.4%</text>

  <rect x="420" y="180" width="150" height="130" rx="6" stroke="#34D399" stroke-width="2.5" stroke-dasharray="6 4" fill="#34D399" fill-opacity="0.08"/>
  <rect x="420" y="158" width="95" height="22" rx="4" fill="#34D399"/>
  <text x="427" y="173" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">QUALITY: A</text>

  <!-- Slicing Grid (SAHI) -->
  <circle cx="310" cy="195" r="4" fill="#38BDF8"/>
  <circle cx="495" cy="245" r="4" fill="#34D399"/>

  <!-- Center Badge / Text -->
  <rect x="250" y="340" width="300" height="42" rx="21" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="366" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    YOLOv8 + SAHI · Deteksi Kualitas Beras
  </text>
  <text x="400" y="415" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    [ Pratinjau Visual Segera Diperbarui ]
  </text>
</svg>